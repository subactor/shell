[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subactor-shell"
version = "0.2.2"
description = "Subactor terminal shell with IntentIR orchestration, governed Control integration, persistent sessions and ACP stdio."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Subactor community" }]
urls = { Repository = "https://github.com/subactor/shell" }
dependencies = [
  "httpx>=0.27,<1",
  "prompt-toolkit>=3.0,<4",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1"]

[project.scripts]
subactor-shell = "subactor_shell.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
