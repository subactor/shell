[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subactor-shell"
version = "0.2.2"
description = "Subactor terminal shell with IntentIR orchestration, governed Control integration, persistent sessions and ACP stdio."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Subactor community" }, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
urls = { Repository = "https://github.com/subactor/shell" }
dependencies = [
  "httpx>=0.27,<1",
  "prompt-toolkit>=3.0,<4",
  "rich>=13,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1",
    "goal>=2.1.0; python_version >= '3.12'",
    "costs>=0.1.53; python_version >= '3.9'",
    "pfix>=0.1.60; python_version >= '3.10'",
]

[project.scripts]
subactor-shell = "subactor_shell.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true
